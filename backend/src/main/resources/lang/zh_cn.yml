# MoeXDSpector 语言文件（zh_cn）
# 所有可读文本集中于此；逻辑配置见 config.yml。
# feedback 相关文本支持 MiniMessage，其余为 & 颜色代码。

prefix: "&8[&bMoeXDSpector&8] &r"

messages:
  no-permission: "&c你没有权限使用该指令。"
  players-only: "&c该指令只能由玩家执行。"
  usage: "&e用法: /spector <玩家ID|random|next|pre|status|afk|off> &7&o(管理: reload / off <玩家>)"
  target-not-found: "&c未找到该在线玩家。"
  target-excluded: "&c该玩家在豁免名单中（pass_player.yml / 权限节点 / NPC），无法被观察。"
  reloaded: "&a已重载 config.yml、pass_player.yml 与语言文件。"

  # 进入/退出观察
  enter-observe: "&a已进入观察者模式。正常退出请输入 &f/spector off&a。"
  mode-exit: "&e检测到你切换了游戏模式，已自动退出观察。"
  spectate-hint: "&7你已处于观察者模式中，如需退出请输入 &f/spector off&7。"
  stopped: "&7已停止观察。"
  admin-stopped: "&a已强制结束 &f%target% &a的观察会话。"
  voluntary-pause: "&7检测到你主动进入观察状态，插件已暂停接管相机（重新执行 &f/spector&7 可恢复）。"

  # 观察与切换
  observing: "&a正在观察玩家 &f%target%&a。"
  observing-random: "&a已开启随机观察模式，每 &f%interval%&a 秒切换一次。"
  observing-timeout: "&c代理端未响应跨服观察请求，请确认 Velocity 端已安装 moexdspector-velocity 且密钥一致。"
  afk-switch: "&e观察对象 &f%target% &e疑似挂机(&7%reason%&e)，已切换到 &f%newtarget%&e。"
  random-switch: "&7轮换观察 -> &f%target%"
  random-switch-afk: "&e观察对象 &f%target% &e疑似挂机(&7%reason%&e)，提前切换到 &f%newtarget%&e。"
  afk-no-candidate: "&e观察对象 &f%target% &e疑似挂机(&7%reason%&e)，但没有可切换的玩家，继续观察。"
  no-candidates: "&c没有可观察的其他在线玩家。"
  victim-switch: "&e观察对象 &f%target% &e死亡，已切换到 &f%newtarget%&e。"
  victim-reattach: "&a原观察对象 &f%target% &a已复活，重新附身。"
  detach-reattach: "&e观察者脱离观察状态，已重新附身到 &f%target%&e。"
  handoff-followed: "&a观察对象 &f%target% &a跨服，已跟随至其所在服务器。"

  # 输入锁定
  lock-cancelled: "&7已拦截视角切换：观察期间无法手动脱离（正常退出请使用 &f/spector off&7）。"
  lock-reattached: "&e检测到脱离观察状态，已重新附身（正常退出请使用 &f/spector off&e）。"

  # 掉线/重连
  relogin-reattach: "&a观察对象 &f%target% &a已重新上线，恢复观察。"
  relogin-switch: "&e观察对象 &f%target% &e掉线，暂时切换到 &f%newtarget%&e（其重连后自动切回）。"
  relogin-abandoned: "&e已放弃等待 &f%target%&e：本会话内不再自动切回，也不会再被随机选中。"
  relogin-expired: "&7观察对象 &f%target% &7未在宽限期内重连，继续观察当前玩家。"

  # 状态与报告
  status: "&7模式: &f%mode% &8| &7目标: &f%target% &8| &7本轮已观察: &f%used% 人 &8| &7同行观察者: &f%cowatchers% 人 &8| &7相机接管: &f%voluntary%"
  status-idle: "&7当前没有进行中的观察会话。"
  status-relogin: "&e观察对象 &f%target% &e已退出网络，正在等待其在宽限期内重连……"
  status-verdict: "&e观察对象 &f%target% &e已离开本服，正在等待代理裁决去向……"
  afk-list-header: "&b—— 近期挂机判定 ——"
  afk-list-empty: "&7近期没有挂机判定记录。"
  afk-list-entry: "&f%player% &7- %reason% &8(%time% 秒前)"

reasons:
  stationary: "原地静止超过 %seconds% 秒"
  container: "打开容器/背包超过 %seconds% 秒"
  autoclicker: "视角冻结且重复同一动作"
  typing: "聊天输入后持续静止超过 %seconds% 秒"

# 画面反馈文本（MiniMessage）
# 可用占位符: %target% 玩家名, %reason% 切换原因(feedback-reasons), %mode% 观察模式
feedback:
  title-text: "<gradient:#00e0ff:#ffffff>正在观察</gradient> <yellow><bold>%target%</bold>"
  title-subtitle: "<gray>%reason%"
  actionbar-text: "<gray>观察中: <white>%target% <dark_gray>· %reason% · %mode%"

  # 各切换事件的 %reason% 文案
  feedback-reasons:
    start: "开始观察"
    afk: "挂机"
    rotate: "轮换"
    manual: "手动切换"
    victim: "目标死亡"
    relogin: "重连恢复"
    detach: "脱离重附身"
    bridge: "掉线桥接"
    handoff: "跨服跟随"
